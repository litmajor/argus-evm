[workspace]
resolver = "2"
members = [
    "crates/argus-types",
    "crates/argus-ingestor",
    "crates/argus-state",
    "crates/argus-sim",
    "crates/argus-executor",
    "crates/argus-runtime",
]
default-members = ["crates/argus-runtime"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["argus-evm"]
repository = "https://github.com/litmajor/argus-evm"

[workspace.dependencies]
# Shared domain
argus-types     = { path = "crates/argus-types" }
argus-ingestor  = { path = "crates/argus-ingestor" }
argus-state     = { path = "crates/argus-state" }
argus-sim       = { path = "crates/argus-sim" }
argus-executor  = { path = "crates/argus-executor" }

# Async runtime
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs"] }
futures = "0.3"
async-trait = "0.1"

# Alloy stack (modern replacement for ethers-rs)
alloy = { version = "0.9", features = ["full"] }
alloy-primitives = { version = "0.8", features = ["serde"] }
alloy-provider = { version = "0.9", features = ["ws", "reqwest", "pubsub"] }
alloy-rpc-types = "0.9"
alloy-sol-types = "0.8"
alloy-contract = "0.9"
alloy-network = "0.9"
alloy-signer-local = "0.9"
alloy-transport-ws = "0.9"

# revm — in-process EVM
revm = { version = "19", default-features = false, features = ["std", "serde", "alloydb"] }
revm-primitives = { version = "15", default-features = false, features = ["std", "serde"] }

# Serialization & errors
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"

# Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }

# Utilities
parking_lot = "0.12"
dashmap = "6"
once_cell = "1.20"
uuid = { version = "1.11", features = ["v4", "serde"] }
hex = "0.4"
eyre = "0.6"
